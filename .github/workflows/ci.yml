name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer derives the version from tags

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore EConomic.Net.slnx

      - name: Build
        run: dotnet build EConomic.Net.slnx --configuration Release --no-restore

      - name: Verify formatting
        if: matrix.os == 'ubuntu-latest'
        run: dotnet format EConomic.Net.slnx --verify-no-changes --no-restore

      # Unit tests only. The integration tests hit the live demo agreement and run on a
      # schedule instead, so an e-conomic outage cannot block an unrelated pull request.
      - name: Test
        run: >
          dotnet test tests/EConomic.Net.Tests
          --configuration Release --no-build
          --logger "trx;LogFileName=test-results.trx"

      - name: Pack
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack src/EConomic.Net --configuration Release --no-build --output ./artifacts

      - name: Upload package
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: ./artifacts/*

  aot:
    name: Native AOT smoke test
    runs-on: ubuntu-latest

    # The package claims IsTrimmable and IsAotCompatible. NSwag's generated clients call
    # reflection-based System.Text.Json overloads, so the analyzers cannot prove that claim even
    # though a source-generated resolver backs them. This compiles natively and runs the real
    # serialization path, which turns the claim into something tested rather than asserted.
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install the native toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish native AOT
        run: >
          dotnet publish tests/EConomic.Net.AotSmokeTest
          --configuration Release -r linux-x64 -o ./artifacts/aot

      - name: Run the native binary
        run: ./artifacts/aot/EConomic.Net.AotSmokeTest
