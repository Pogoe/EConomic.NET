name: Integration tests

# These run against a live e-conomic agreement and write to it, so they need one of their own.
# They are scheduled rather than run per pull request: an e-conomic outage should not block a PR.
#
# Requires two repository secrets, pointing at a THROWAWAY agreement:
#   ECONOMIC_APP_SECRET_TOKEN
#   ECONOMIC_AGREEMENT_GRANT_TOKEN
# Without them every test skips, and the job still passes — a missing secret is a configuration
# gap, not a broken library, and failing here would be indistinguishable from a real regression.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  ECONOMIC_RUN_INTEGRATION_TESTS: '1'

jobs:
  integration:
    name: Live agreement tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Report whether an agreement is configured
        run: |
          if [ -z "${{ secrets.ECONOMIC_APP_SECRET_TOKEN }}" ]; then
            echo "::warning::No agreement configured; every integration test will skip."
          fi

      # ECONOMIC_RUN_BOOKING_TESTS is deliberately absent. Booking a draft invoice cannot be
      # undone, so a scheduled job must not do it every morning.
      - name: Test
        env:
          ECONOMIC_APP_SECRET_TOKEN: ${{ secrets.ECONOMIC_APP_SECRET_TOKEN }}
          ECONOMIC_AGREEMENT_GRANT_TOKEN: ${{ secrets.ECONOMIC_AGREEMENT_GRANT_TOKEN }}
        run: dotnet test tests/EConomic.Net.IntegrationTests --configuration Release
