name: Integration tests

# These hit e-conomic's live demo agreement (read-only). They run on a schedule so that an
# upstream change is caught, without letting an e-conomic outage block pull requests.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  ECONOMIC_RUN_INTEGRATION_TESTS: '1'

jobs:
  integration:
    name: Demo agreement smoke tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/EConomic.Net.IntegrationTests --configuration Release
