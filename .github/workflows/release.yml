name: Release

# Publishing is triggered by pushing a version tag, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
# MinVer turns that tag into the package version.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # creating the GitHub release
  id-token: write # requesting the OIDC token nuget.org exchanges for a publish key

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    name: Pack and publish to NuGet
    runs-on: ubuntu-latest
    # The environment name is part of the nuget.org trusted publishing policy, so it is load-bearing
    # rather than cosmetic: renaming it here stops the token exchange until the policy is updated to
    # match. An approval gate can be added to this environment if a release should need sign-off.
    environment: nuget

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore EConomic.Net.slnx

      - name: Build
        run: dotnet build EConomic.Net.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/EConomic.Net.Tests --configuration Release --no-build

      - name: Pack
        run: dotnet pack src/EConomic.Net --configuration Release --no-build --output ./artifacts

      # Trusted publishing: GitHub signs a short-lived OIDC token describing this repository,
      # workflow file and environment, and nuget.org exchanges it for an API key valid for one hour
      # if that matches a policy configured on the account. No long-lived key is stored anywhere.
      # The exchange happens immediately before the push because of that one-hour window.
      - name: Exchange the OIDC token for a publish key
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }} # nuget.org profile name, not the account's email address

      # No --skip-duplicate. nuget.org answers 409 for several distinct conditions — the version
      # already exists, the id is too similar to another, the id is reserved — and that flag
      # collapses all of them into a success with one canned "already exists" message. That is how
      # v0.1.0-rc.1 reported a green release while publishing nothing. A tag should be pushed once,
      # so a genuine duplicate is also a real error worth failing on.
      - name: Publish to NuGet
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: ./artifacts/*
          generate_release_notes: true
          # The action does not infer this, so without it a `v0.1.0-rc.1` tag would be published as
          # a full release and shown as "Latest" ahead of the stable version. A SemVer prerelease
          # always carries a hyphen, and a stable version never does, so the tag decides.
          prerelease: ${{ contains(github.ref_name, '-') }}
